# Render Blueprint: New > Blueprint > pick this repo.
# Database: use Neon (paste its connection string into DATABASE_URL when asked).
services:
  # ---------- Flask API ----------
  - type: web
    name: lms-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL        # Neon: postgresql://USER:PASSWORD@HOST/DB?sslmode=require
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DEV_AUTH
        value: "false"
      - key: ANTHROPIC_API_KEY   # optional, switches on the AI Coach
        sync: false
      # ---- M-Pesa payments (see README, "Payments") ----
      - key: PAYWALL_ENABLED     # set to false to keep every lesson open until payments are live
        value: "true"
      - key: MPESA_ENV           # sandbox first, production after Safaricom go-live
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_TRANSACTION_TYPE  # CustomerPayBillOnline (Paybill) or CustomerBuyGoodsOnline (Till)
        sync: false
      - key: MPESA_PARTY_B           # your Till number (Buy Goods only)
        sync: false
      - key: MPESA_CALLBACK_BASE # the public https address of the SITE, e.g. https://learn.example.com
        sync: false
      - key: MPESA_CALLBACK_SECRET
        generateValue: true

  # ---------- React site ----------
  - type: web
    name: lms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_DEV_AUTH
        value: "false"
      - key: VITE_SITE_URL       # used for WhatsApp/Facebook link previews
        value: https://learn.example.com
    routes:
      # Proxy the API through the same origin so the login cookie works.
      # If you renamed the API service, change lms-api below to match its URL.
      - type: rewrite
        source: /api/*
        destination: https://lms-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
