services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: lms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://lms:${POSTGRES_PASSWORD:-lms}@db:5432/lms
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEV_AUTH: ${DEV_AUTH:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COACH_MODEL: ${COACH_MODEL:-claude-sonnet-5-5}
      PAYWALL_ENABLED: ${PAYWALL_ENABLED:-true}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_SIMULATE: ${MPESA_SIMULATE:-false}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PARTY_B: ${MPESA_PARTY_B:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      MPESA_CALLBACK_BASE: ${MPESA_CALLBACK_BASE:-}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:-}
      REFUND_ENABLED: ${REFUND_ENABLED:-true}
      REFUND_PARTIAL_DAYS: ${REFUND_PARTIAL_DAYS:-3}
      REFUND_PARTIAL_PERCENT: ${REFUND_PARTIAL_PERCENT:-50}
      WORKSPACE_DAYS: ${WORKSPACE_DAYS:-30}
      WORKSPACE_MIN_PERCENT: ${WORKSPACE_MIN_PERCENT:-25}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_DEV_AUTH: ${DEV_AUTH:-false}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:5000
      BACKEND_HOST: backend:5000
      RESOLVER: 127.0.0.11   # Docker's internal DNS
    ports:
      - "8080:80"

volumes:
  pgdata:
